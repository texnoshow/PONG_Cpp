name: C++ Pong Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    # Анти-бот защита: сборка НЕ запустится, если её триггернул бот (например, dependabot, github-actions[bot] и др.)
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && contains(github.actor, '[bot]') == false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Compile Pong Game
      run: |
        cl.exe /EHsc main.cpp /Fe:pong_game.exe

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pong-windows-exe
        path: pong_game.exe
