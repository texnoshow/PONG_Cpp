name: C++ Pong Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && contains(github.actor, '[bot]') == false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Настраивает окружение MSVC строго под архитектуру x86
    - name: Set up MSVC Developer Command Prompt (x86)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Compile Pong Game
      run: |
        cl.exe /EHsc main.cpp /Fe:pong_game.exe

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pong-windows-x86-exe
        path: pong_game.exe
